    attributes:
      label: Context of use
      description: In what professional or cognitive context is this tool relevant?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Why this improves navigation
      description: How does adding this tool help orientation rather than ranking?
    validations:
      required: true
