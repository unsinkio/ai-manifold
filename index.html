<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manifold Cognitivo de IA</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM (UMD) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDKs (Compat version for easier CDN usage) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>


    <style>
        /* Loading Overlay */
        #loader {
            position: fixed;
            inset: 0;
            background: #0b1020;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #9da2ff;
            font-family: sans-serif;
            transition: opacity 0.5s;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(157, 162, 255, 0.3);
            border-top-color: #9da2ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Custom Scrollbar for Sidebar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #050712;
        }

        ::-webkit-scrollbar-thumb {
            background: #2a2f45;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3b415c;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fadeIn {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>

    <!-- Error Trap -->
    <script>
        window.removeLoader = function () {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 500);
            }
        };

        window.onerror = function (msg, url, line, col, error) {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.innerHTML += `<div style="color: #ff6b6b; margin-top: 20px; font-size: 0.8rem; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 4px; max-width: 80%;">
          <strong>Error:</strong> ${msg}<br/>
          <small>${url.split('/').pop()}:${line}</small>
        </div>`;
            }
        };
    </script>
    <link rel="icon" href="data:,">
</head>

<body class="bg-[#0b1020] text-white">
    <!-- Loading UI -->
    <div id="loader">
        <div class="spinner"></div>
        <p>Cargando Manifold...</p>
    </div>
    <div id="root"></div>

    <!-- LOAD SCRIPTS SEQUENTIALLY (ORDER MATTERS) -->

    <!-- Data -->
    <script src="src/data/clusters.js"></script>
    <script src="src/data/coreNodes.js"></script>

    <!-- Services & Logic -->
    <script src="src/services/auth.js"></script>
    <script src="src/services/db.js"></script>
    <script src="src/services/storage.js"></script>
    <script src="src/services/i18n.js"></script>
    <script src="src/logic/clustering.js"></script>

    <!-- Components -->
    <script type="text/babel" src="src/components/RadialMap.js"></script>
    <script type="text/babel" src="src/components/UserProfile.js"></script>
    <script type="text/babel" src="src/components/ToolEvaluator.js"></script>
    <script type="text/babel" src="src/components/ToolAdder.js"></script>
    <script type="text/babel" src="src/components/Toast.js"></script>
    <script type="text/babel" src="src/components/Streamgraph.js"></script>
    <script type="text/babel" src="src/components/LoginScreen.js"></script>
    <script type="text/babel" src="src/App.js"></script>

    <!-- Entry Point -->
    <script type="text/babel" src="src/main.js"></script>
</body>

</html>
